<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="./src/css/styles.css" />
  </head>
  <body>
    <div id="gameContainer">
      <canvas id="gameCanvas"></canvas>

      <!-- HUD -->
      <div id="hud">
        <div id="timer">0.00</div>
        <div id="healthBarContainer">
          <div id="healthBarFill"></div>
        </div>
      </div>

      <!-- TODO, use js to conditionally add these when needed, not active each time? -->
      <!-- Timer -->
      <!-- Main Menu Panel -->
      <div id="mainMenu" class="ui-panel">
        <h1>Game Started</h1>
        <button data-action="start">Enter</button>
        <button data-action="start">GoToCV</button>
        <button data-action="mute">Mute</button>
      </div>

      <!-- Pause Panel -->
      <div id="pauseMenu" class="ui-panel">
        <h2>PAUSED</h2>
        <button data-action="resume">Resume</button>
        <button data-action="returnToMenu">QUIT TO MENU</button>
      </div>

      <!-- Loading Screen -->
      <div id="loadingScreen" class="ui-panel active">
        <h2>Loading</h2>
        <p>adding</p>
      </div>

      <!-- Game Over Screen -->
      <div id="gameOverMenu" class="ui-panel">
        <h2>GAME OVER</h2>
        <button data-action="start">Retry</button>
        <button data-action="returnToMenu">QUIT TO MENU</button>
      </div>

      <!-- Mission Complete Screen -->
      <div id="missionCompleteMenu" class="ui-panel">
        <h2>Mission Complete</h2>
        <button data-action="start">Play Again</button>
        <button data-action="returnToMenu">QUIT TO MENU</button>
      </div>
    </div>

    <img
      id="Full_Village_Testing_1"
      src="./src/assets/tilemaps/village/Full_Village_Testing_1.png"
      alt="Full_Village_Testing_1"
    />
    <script type="module" src="./src/js/main.js"></script>
  </body>
</html>
